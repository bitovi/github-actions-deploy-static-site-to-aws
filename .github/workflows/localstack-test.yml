  test-action-full-options:
        runs-on: ubuntu-latest
        needs: test-with-localstack
        strategy:
          matrix:
            tf_action: [apply, destroy]
            aws_site_cdn_enabled: ['true', 'false']
            aws_r53_root_domain_deploy: ['true', 'false']
        services:
          localstack:
            image: localstack/localstack:latest
            ports:
              - 4566:4566
            options: >-
              --health-cmd="curl -f http://localhost:4566/_localstack/health || exit 1"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=5
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566
          LOCALSTACK: true
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Run action with matrix options
            uses: ./
            with:
              checkout: 'true'
              aws_access_key_id: test
              aws_secret_access_key: test
              aws_default_region: us-east-1
              tf_action: ${{ matrix.tf_action }}
              tf_state_bucket_destroy: 'true'
              aws_site_source_folder: '.'
              aws_site_source_include_hidden: 'true'
              aws_site_root_object: 'index.html'
              aws_site_error_document: 'error.html'
              aws_site_bucket_name: 'test-site-bucket'
              aws_site_cdn_enabled: ${{ matrix.aws_site_cdn_enabled }}
              aws_site_cdn_response_headers_policy_id: '67f7725c-6f97-4210-82d7-5512b31e9d42'
              aws_site_cdn_min_ttl: '0'
              aws_site_cdn_default_ttl: '86400'
              aws_site_cdn_max_ttl: '31536000'
              aws_r53_domain_name: 'example.com'
              aws_r53_sub_domain_name: 'test'
              aws_r53_root_domain_deploy: ${{ matrix.aws_r53_root_domain_deploy }}
              aws_r53_cert_arn: 'arn:aws:acm:us-east-1:123456789012:certificate/abcdefg'
              aws_r53_create_root_cert: 'true'
              aws_r53_create_sub_cert: 'true'
