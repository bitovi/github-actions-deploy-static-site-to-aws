name: LocalStack Terraform Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  LocalStack-Terraform-Test:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            aws_r53_root_domain_deploy: ['true', 'false']
            aws_r53_create_root_cert: ['true', 'false']
            aws_r53_create_sub_cert: ['true', 'false']

        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566
          LOCALSTACK: true
        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Start LocalStack
            uses: LocalStack/setup-localstack@v0.2.3
            with:
              image-tag: 'latest'
              install-awslocal: 'true'

          - name: Pre-create Terraform needed resources
            run: |
              aws --endpoint-url=$AWS_ENDPOINT_URL s3 mb s3://test-site-bucket
              aws --endpoint-url=$AWS_ENDPOINT_URL route53 create-hosted-zone \
                  --name example.local \
                  --caller-reference $(date +%s)

          - name: Run action with matrix options
            uses: ./
            with:
              checkout: 'true'
              aws_access_key_id: test
              aws_secret_access_key: test
              aws_default_region: us-east-1
              tf_action: 'apply'
              tf_state_bucket_destroy: 'true'
              aws_site_source_folder: '.'
              aws_site_source_include_hidden: 'true'
              aws_site_root_object: 'index.html'
              aws_site_error_document: 'error.html'
              aws_site_bucket_name: 'test-site-bucket'
              aws_site_cdn_enabled: 'false' # CDN is not enabled in Free Localstack
              aws_site_cdn_response_headers_policy_id: '' #'67f7725c-6f97-4210-82d7-5512b31e9d42'
              aws_site_cdn_min_ttl: '0'
              aws_site_cdn_default_ttl: '86400'
              aws_site_cdn_max_ttl: '31536000'
              aws_r53_domain_name: 'example.local'
              aws_r53_sub_domain_name: 'test'
              aws_r53_root_domain_deploy: ${{ matrix.aws_r53_root_domain_deploy }}
              aws_r53_cert_arn: 'arn:aws:acm:us-east-1:123456789012:certificate/abcdefg'
              aws_r53_create_root_cert: ${{ matrix.aws_r53_create_root_cert }}
              aws_r53_create_sub_cert: ${{ matrix.aws_r53_create_sub_cert }}
